# ==============================================================================
# ديوان السعادة – نغم يجمعنا
# Docker Compose Production Deployment Configuration
# ==============================================================================

version: '3.8'

services:
  dewan-alsaada:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dewan-alsaada-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - LIBRARY_ACCESS_CODE=${LIBRARY_ACCESS_CODE:-1#7a4}
      - YOUTUBE_CHANNEL_ID=${YOUTUBE_CHANNEL_ID:-UC2XgHgOGcGcDJHjb7DkB2Mg}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
    volumes:
      # Persistent storage for JSON database (videos, artists, radio, albums, settings)
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
