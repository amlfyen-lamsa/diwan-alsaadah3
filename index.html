      // Gracefully suppress benign Vite HMR WebSocket notifications in sandboxed environments
      (function() {
        var isViteWs = function(str) {
          if (!str) return false;
          return (
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('WebSocket') !== -1 && (str.indexOf('closed') !== -1 || str.indexOf('failed') !== -1) ||
            str.indexOf('[vite] connecting...') !== -1
          );
        };

        // Filter console.error from triggering external test frame overlays
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            return (a && (a.message || a.stack || String(a))) || '';
          }).join(' ');
          if (isViteWs(joined)) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        var suppress = function(e) {
          var str = String((e && (e.message || (e.error && e.error.message) || e.reason)) || '');
          if (isViteWs(str) || str.indexOf('vite') !== -1 || str.indexOf('ws:') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };
        window.addEventListener('error', suppress, true);
        window.addEventListener('unhandledrejection', suppress, true);
        var origOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          if (suppress({ message: msg, error: err })) return true;
          return origOnError ? origOnError.apply(this, arguments) : false;
        };
      })();
